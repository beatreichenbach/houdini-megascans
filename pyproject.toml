[project]
name = "houdini-megascans"
version = "0.2.0"
description = "A Quixel Bridge plugin for SideFX Houdini Solaris to import Megascans assets directly into the stage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "houdini-component-builder@git+https://github.com/beatreichenbach/houdini-component-builder@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "PySide6>=6.11",
    "python-semantic-release>=10.0",
    "qt-material-icons>=0.2,<1",
    "ruff>=0.16",
    "types-houdini>=21.0",
    "types-usd>=24.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["megascans*"]

[tool.semantic_release]
version_variables = ["megascans/__init__.py:__version__"]
version_toml  = ["pyproject.toml:project.version"]
allow_zero_version = true

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.github]
upload_to_release = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["megascans/qt_material_icons"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "TID", "RUF"]
ignore = ["TID252"]

[tool.ruff.format]
quote-style = "single"
