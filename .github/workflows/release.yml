name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ZIP file
        run: |
          mkdir -p dist
          cp src/*.json dist/
          mkdir -p dist/megascans
          cp -r src/menu dist/megascans/
          mkdir -p dist/megascans/python
          python3.11 -m pip install . --target dist/megascans/python
          cd dist
          zip -r ../megascans-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: megascans-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}